<style>
:root{
  --bg:#fafbfc;--paper:#fff;--ink:#172b4d;--muted:#6b778c;--line:#e4e8ee;
  --blue:#0052cc;--blue-deep:#0747a6;--blue-soft:#e9f2ff;
  --navy:#172b4d;--teal:#0e8a76;--purple:#6a5ad8;--amber:#b97a12;
  --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg)}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* ===== 顶部导航（Atlassian 式白底+蓝主色） ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1440px;margin:auto;height:60px;padding:0 36px;display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#0052cc,#2684ff);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.brand em{font-style:normal;color:#8a939e;font-weight:500;font-size:12.5px}
.nav{display:flex;gap:2px}
.nav button{border:0;background:transparent;color:#5a6470;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:550}
.nav button:hover{background:#f0f3f7;color:var(--ink)}
.nav button.active{color:var(--blue)}
.nav button.active:after{content:"";display:block;height:2.5px;background:var(--blue);border-radius:2px;margin:5px -14px -11px}
.searchbox{margin-left:auto;display:flex;align-items:center;gap:9px;height:40px;width:min(380px,32vw);background:#f1f3f6;border:1px solid transparent;border-radius:10px;padding:0 14px;color:#9298a1}
.searchbox:focus-within{background:#fff;border-color:#b9c9e8;box-shadow:0 0 0 3px rgba(0,82,204,.08)}
.searchbox input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--ink)}

.wrap{max-width:1440px;margin:auto;padding:0 36px}

/* ===== 首页 Hero（Mobbin 式大标题+居中搜索） ===== */
.hero{padding:76px 0 46px;text-align:center;border-bottom:1px solid var(--line);
  background:radial-gradient(64% 88% at 50% 0%,#eaf3ff 0%,#fafbfc 72%)}
.hero h1{font-size:44px;letter-spacing:-.035em;margin:0 0 14px;font-weight:800}
.hero h1 span{background:linear-gradient(120deg,#0052cc,#2684ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:15.5px;color:var(--muted);max-width:560px;margin:0 auto 30px;line-height:1.75}
.hero-search{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;height:52px;background:#fff;border:1px solid #d7deea;border-radius:14px;padding:0 18px;box-shadow:0 14px 40px rgba(9,30,66,.09);color:#9298a1}
.hero-search input{border:0;outline:0;background:transparent;width:100%;font-size:14.5px}
.hero-tags{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.htag{font-size:12.5px;font-weight:600;color:#3d4d6b;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 15px;transition:.14s;cursor:pointer}
.htag:hover{border-color:var(--blue);color:var(--blue)}
.hero-stats{display:flex;gap:40px;justify-content:center;margin-top:38px}
.hstat b{display:block;font-size:26px;letter-spacing:-.03em}
.hstat span{font-size:12px;color:var(--muted)}

/* ===== 模块页 hero（Atlassian 式左对齐） ===== */
.page-hero{padding:40px 0 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#f4f8ff,transparent)}
.crumbs{font-size:12px;color:#8a939e;margin-bottom:8px;font-weight:550}
.page-hero h1{font-size:28px;letter-spacing:-.03em;margin:0 0 6px}
.page-hero p{font-size:13.5px;color:var(--muted);max-width:640px;line-height:1.7;margin:0}

/* ===== 分组导航（Figma Community 式 chip） ===== */
.group-nav{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 4px;position:sticky;top:60px;background:var(--bg);z-index:40}
.gtab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-size:12.5px;font-weight:600;color:#55606c;transition:.14s}
.gtab:hover{border-color:#b9c9e8}
.gtab.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* ===== 卡片（Mobbin 式大预览+底部信息） ===== */
.sec{padding:28px 0 10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.sec-head h2{font-size:18px;margin:0;letter-spacing:-.02em}
.sec-head .sub{font-size:12.5px;color:#9298a1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.mcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.2s;cursor:pointer;display:flex;flex-direction:column}
.mcard:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(9,30,66,.12);border-color:#c8d6ef}
.mthumb{height:170px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.mthumb.c-navy{background:linear-gradient(155deg,#0d2b52,#27548f)}
.mthumb.c-blue{background:linear-gradient(155deg,#0747a6,#2684ff)}
.mthumb.c-teal{background:linear-gradient(155deg,#0b6b5c,#19a088)}
.mthumb.c-purple{background:linear-gradient(155deg,#3b3187,#7566e0)}
.mthumb.c-amber{background:linear-gradient(155deg,#8a5c0e,#d8a13a)}
.mthumb.c-mist{background:linear-gradient(155deg,#e6ecf5,#f6f9fd)}
.mock{position:absolute;inset:26px;background:#fff;border-radius:12px;box-shadow:0 14px 34px rgba(4,16,34,.22);padding:15px;overflow:hidden}
.mock b{display:block;width:46%;height:10px;border-radius:5px;background:#1b2b3f;margin-bottom:13px}
.mock i{display:block;height:7px;border-radius:4px;background:#e3e7ee;margin:7px 0}
.mock i.w1{width:88%}.mock i.w2{width:66%}.mock i.w3{width:76%}
.mbadge{position:absolute;top:11px;left:11px;font-size:10px;font-weight:700;color:#fff;background:rgba(6,18,36,.5);backdrop-filter:blur(4px);border-radius:7px;padding:3.5px 10px;letter-spacing:.03em}
.mlink-chip{position:absolute;bottom:11px;right:11px;font-size:9.5px;font-weight:800;color:#3d4854;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;padding:2.5px 9px}
.mbody{padding:15px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.mbody h3{font-size:14.5px;margin:0;letter-spacing:-.015em}
.mbody p{font-size:12px;color:#75808c;line-height:1.6;margin:0;flex:1}
.mmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#98a0ab;margin-top:4px}
.chip{font-size:10px;font-weight:700;border-radius:6px;padding:2.5px 9px;white-space:nowrap}
.chip.ok{color:#0e7a5f;background:#e6f5ef}
.chip.doing{color:#265cc4;background:#e9f0fc}
.chip.wait{color:#a06a10;background:#faf1de}
.chip.old{color:#75808c;background:#eef0f3}

/* ===== 项目区大卡（带链接按钮，Atlassian 引导色） ===== */
.bigcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.2s;cursor:pointer;display:flex;flex-direction:column}
.bigcard:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(9,30,66,.12);border-color:#c8d6ef}
.bigthumb{height:150px;position:relative;overflow:hidden}
.bigbtn{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(6,18,36,.5);backdrop-filter:blur(4px);border-radius:8px;padding:4px 11px;letter-spacing:.02em}
.bigbody{padding:17px 18px 18px;display:flex;flex-direction:column;gap:7px;flex:1}
.bigbody h3{font-size:16px;margin:0;letter-spacing:-.015em}
.bigbody p{font-size:12.5px;color:#75808c;line-height:1.65;margin:0;flex:1}
.bigfoot{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.plat{font-size:10.5px;font-weight:700;color:#3355a8;background:#eef4ff;border-radius:6px;padding:3px 9px}

/* ===== 工具卡（继承 tcard 风格） ===== */
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:19px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:12px}
.tcard:hover{border-color:#c8d6ef;box-shadow:0 14px 32px rgba(9,30,66,.1);transform:translateY(-3px)}
.tcard-top{display:flex;align-items:center;gap:12px}
.t-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none;letter-spacing:.01em}
.t-ico.sk{background:var(--purple)}.t-ico.fp{background:var(--blue)}.t-ico.cv{background:var(--teal)}
.tcard-top h3{font-size:14px;margin:0;letter-spacing:-.01em}
.tkind{display:block;font-size:10.5px;color:#9298a1;margin-top:2px}
.tcard p{font-size:12px;color:#75808c;line-height:1.65;margin:0;flex:1}
.tcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.t-tags{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.ttag{font-size:10px;color:#5b6673;background:#f1f3f6;border-radius:99px;padding:3px 11px;white-space:nowrap}
.t-owner{font-size:10.5px;color:#98a0ab;white-space:nowrap;flex:none}

/* ===== 指南卡 ===== */
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;cursor:pointer;transition:.16s}
.gcard:hover{border-color:#c8d6ef;box-shadow:0 12px 30px rgba(9,30,66,.09)}
.gcard .gk{font:800 10px ui-monospace,Menlo;color:#8a93a0;letter-spacing:.1em;text-transform:uppercase}
.gcard h3{font-size:15px;margin:9px 0 6px}
.gcard p{font-size:12.5px;color:#7c8792;line-height:1.65;margin:0}

/* ===== 场景快捷（首页） ===== */
.scen-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:26px 0 4px}
.scen{display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;cursor:pointer;transition:.15s}
.scen:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,82,204,.09)}
.scen .si{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.scen b{font-size:12.5px}
.scen small{font-size:10.5px;color:#9298a1}

/* ===== 抽屉 ===== */
.mask{position:fixed;inset:0;background:rgba(9,17,28,.46);z-index:80;display:none}
.mask.show{display:block}
.drawer{position:absolute;right:0;top:0;width:min(700px,100%);height:100%;overflow:auto;background:#fff;box-shadow:-18px 0 60px rgba(9,22,42,.22)}
.dx{position:sticky;top:14px;z-index:5;float:right;margin:14px 16px 0 0;width:36px;height:36px;border:0;border-radius:10px;background:#f0f2f5;font-size:18px}
.d-cover{height:230px;position:relative;overflow:hidden}
.d-cover.t-navy{background:linear-gradient(150deg,#0d2b52,#27548f)}
.d-cover.t-blue{background:linear-gradient(150deg,#0747a6,#2684ff)}
.d-cover.t-teal{background:linear-gradient(150deg,#0b6b5c,#19a088)}
.d-cover.t-purple{background:linear-gradient(150deg,#3b3187,#7566e0)}
.d-cover.t-amber{background:linear-gradient(150deg,#8a5c0e,#d8a13a)}
.d-cover.t-mist{background:linear-gradient(150deg,#dfe6ef,#eef2f7)}
.d-body{padding:26px 32px 44px}
.d-kick{font:800 10px ui-monospace,Menlo;color:#8a93a0;letter-spacing:.1em;text-transform:uppercase}
.d-body h2{font-size:24px;letter-spacing:-.03em;margin:6px 0 8px}
.d-body .d-desc{font-size:13px;color:#68737f;line-height:1.75;margin:0 0 22px}
.d-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.dm{background:#f6f8fb;border-radius:10px;padding:12px 14px}
.dm span{display:block;font-size:10px;color:#9298a1;margin-bottom:4px}
.dm strong{font-size:12.5px}
.d-sec{font-size:12px;font-weight:800;margin:22px 0 10px;color:#39434e}
.d-links{display:grid;gap:8px}
.dlink{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;transition:.14s}
.dlink:hover{border-color:#b9c9e8;background:#f8faff}
.dlink .lp{flex:1;word-break:break-all}
.dlink em{font-style:normal;font-size:10.5px;color:#9298a1;flex:none}
.dlink.off{opacity:.45;pointer-events:none}
.dlink.dead{background:#fdf6f5;border-color:#f0d8d5}
.dlink .st{font-size:9.5px;font-weight:800;border-radius:5px;padding:2px 8px;flex:none}
.st.ok{color:#0e7a5f;background:#e6f5ef}
.st.wait{color:#a06a10;background:#faf1de}
.st.dead{color:#b3413c;background:#fdeeed}
.d-snaps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dsnap{height:110px;border-radius:9px;background:linear-gradient(150deg,#eef2f8,#f7f9fc);border:1px solid var(--line);position:relative;overflow:hidden}
.dsnap:before{content:"";position:absolute;inset:14px;background:#fff;border-radius:7px;box-shadow:0 5px 14px rgba(13,26,42,.07)}
.dsnap:after{content:"";position:absolute;left:26px;right:26px;top:34px;height:5px;border-radius:4px;background:#e2e6ec;box-shadow:0 11px 0 #eef1f5,0 22px 0 #eef1f5}
.rel-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:11.5px;font-weight:600;color:#3d4854;background:#fff;cursor:pointer;transition:.14s}
.rel-chip:hover{border-color:var(--blue);color:var(--blue)}

/* ===== 页脚 ===== */
.foot{border-top:1px solid var(--line);margin-top:44px;padding:24px 0 44px}
.foot-in{max-width:1440px;margin:auto;padding:0 36px;display:flex;gap:20px;flex-wrap:wrap;font-size:11.5px;color:#9298a1}
.empty{padding:60px;text-align:center;border:1.5px dashed #d5dae0;border-radius:16px;color:#9298a1;background:#fff;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:#172b4d;color:#fff;font-size:13px;padding:10px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:.22s;z-index:120}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:1080px){
  .g4,.scen-strip{grid-template-columns:repeat(3,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:34px}
  .hero-stats{gap:26px}
}
@media(max-width:720px){
  .topbar-in{padding:0 16px;gap:10px}.nav{display:none}
  .wrap{padding:0 16px}
  .g2,.g3,.g4,.d-meta{grid-template-columns:1fr}
  .scen-strip{grid-template-columns:repeat(2,1fr)}
  .searchbox{display:none}
  .hero h1{font-size:27px}
  .hero p{font-size:13.5px}
}
</style>

function match(x,fields){

  const q=state.q.trim().toLowerCase();
  return fields.join(' ').toLowerCase().includes(q);

function assetCard(a){
  return `<article class="mcard" data-kind="asset" data-id="${a.id}">
    <div class="mthumb c-${a.tone||'mist'}">
      <span class="mbadge">${esc(a.cat)}</span>
      <div class="mock"><b></b><i class="w1"></i><i class="w2"></i><i class="w3"></i></div>
      <div class="mlink-chip">${a.links.map(l=>`<span class="src" style="margin-left:4px">${esc(l.label.split(' ')[0])}</span>`).join('')}</div>
    </div>
    <div class="mbody">
      <h3>${esc(a.title)}</h3>
      <p>${esc(a.desc)}</p>
      <div class="mmeta"><span>${esc(a.owner)} · ${esc(a.updated)}</span>${statusChip(a.perm)}</div>
    </div>
  </article>`;
}
function projectCard(p){
  return `<article class="bigcard" data-kind="project" data-id="${p.id}">
    <div class="bigthumb mthumb c-${p.tone}">
      <span class="mbadge">${esc(p.biz)}</span>
      <span class="bigbtn">${p.links[0]&&p.links[0].url!=='#'?'打开链接 ↗':'查看详情'}</span>

    <div class="bigbody">

      <p>${esc(p.desc)}</p>
      <div class="bigfoot">
        <span class="plat">${p.links.some(l=>l.url.includes('teams'))?'Teams':p.links.some(l=>l.url.includes('figma'))?'Figma':'文档'}</span>
        <span style="font-size:11px;color:#98a0ab">${esc(p.owner)} · ${esc(p.updated)}</span>
        ${statusChip(p.status)}

    </div>

}
function toolRow(t){
  return `<article class="tcard" data-kind="tool" data-id="${t.id}">
    <div class="tcard-top"><div class="t-ico ${t.color}">${t.ico}</div><div><h3>${esc(t.title)}</h3><span class="tkind">${esc(t.kind)}</span></div></div>

      <span class="t-owner">${t.used.length?esc(t.used[0]):esc(t.owner||'设计组')}</span>
    </div>
  </article>`;
}
function guideCard(g){
  return `<article class="gcard" data-kind="guide" data-id="${g.id}">
    <span class="gk">${esc(g.kick)}</span><h3>${esc(g.title)}</h3><p>${esc(g.desc)}</p>
  </article>`;
}
function linkHTML(l){
  if(l.st==='dead')return `<div class="dlink dead"><span class="st dead">已失效</span><span class="lp">${esc(l.label)}</span><em>建议用快照 ↗</em></div>`;
  if(!l.url||l.url==='#')return `<div class="dlink off"><span class="st wait">待补</span><span class="lp">${esc(l.label)}</span><em>—</em></div>`;
  return `<a class="dlink" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="st ${l.st==='wait'?'wait':'ok'}">${l.st==='wait'?'待确认':'正常'}</span><span class="lp">${esc(l.label)}</span><em>打开 ↗</em></a>`;
}

      <div class="dm"><span>权限</span><strong>${esc(x.perm)}</strong></div>
    </div>
    <div class="d-sec">原始链接</div><div class="d-links">${x.links.map(linkHTML).join('')}</div>
    ${src.length?`<div class="d-sec">来源项目</div><div>${src.map(p=>`<span class="rel-chip" data-open="project:${p.id}">${esc(p.title)} →</span> `).join('')}</div>`:''}
    <div class="d-sec">关键快照</div><div class="d-snaps"><div class="dsnap"></div><div class="dsnap"></div><div class="dsnap"></div></div></div>`;
  }else if(kind==='project'){x=allProjects().find(v=>v.id===id);
    const rel=(x.used||[]).map(u=>({t:u})).filter(Boolean);
    html=`<div class="d-cover t-${x.tone}"><div class="mock" style="position:absolute;inset:34px"><b></b><i class="w1"></i><i class="w2"></i><i class="w3"></i></div></div>
    <div class="d-body"><div class="d-kick">PROJECT · ${esc(x.biz)}</div><h2>${esc(x.title)}</h2><p class="d-desc">${esc(x.desc)}</p>
    <div class="d-meta">
      <div class="dm"><span>负责人</span><strong>${esc(x.owner)}</strong></div>
      <div class="dm"><span>状态</span><strong>${esc(x.status)}</strong></div>
      <div class="dm"><span>更新</span><strong>${esc(x.updated)}</strong></div>
    </div>
    <div class="d-sec">原始链接</div><div class="d-links">${x.links.map(linkHTML).join('')}</div>
    <div class="d-sec">关键快照</div><div class="d-snaps"><div class="dsnap"></div><div class="dsnap"></div><div class="dsnap"></div></div></div>`;
  }else if(kind==='tool'){x=allTools().find(v=>v.id===id);
    html=`<div class="d-cover t-${x.color==='sk'?'purple':x.color==='fp'?'blue':'teal'}"></div>
    <div class="d-body"><div class="d-kick">TOOL · ${esc(x.kind)}</div><h2>${esc(x.title)}</h2><p class="d-desc">${esc(x.desc)}</p>
    <div class="d-meta">
      <div class="dm"><span>类型</span><strong>${esc(x.kind)}</strong></div>
      <div class="dm"><span>维护人</span><strong>${esc(x.owner||'设计组')}</strong></div>
      <div class="dm"><span>更新</span><strong>${esc(x.updated||'—')}</strong></div>
    </div>
    <div class="d-sec">适用场景</div><div class="t-tags">${x.tags.map(t=>`<span class="ttag">${esc(t)}</span>`).join('')}</div>
    ${x.used.length?`<div class="d-sec">使用过的项目</div><div>${x.used.map(u=>`<span class="rel-chip">${esc(u)}</span> `).join('')}</div>`:''}
    <div class="d-sec">入口</div><div class="d-links">${x.links.map(linkHTML).join('')}</div></div>`;
  }else{x=allGuides().find(v=>v.id===id);
    html=`<div class="d-cover t-amber"></div>
    <div class="d-body"><div class="d-kick">${esc(x.kick)}</div><h2>${esc(x.title)}</h2><p class="d-desc">${esc(x.desc)}</p>
    <div class="d-sec">正文入口</div><div class="d-links">${x.links.map(linkHTML).join('')}</div></div>`;
  }
  $('#drawerBody').innerHTML=html;
  $('#mask').classList.add('show');
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{e.stopPropagation();const[k,id]=el.dataset.open.split(':');openDrawer(k,id)});
}

/* ================= 渲染总控 ================= */
function render(){
  renderNav();
  const app=$('#app');
  if(state.page==='home')app.innerHTML=pageHome();
  else if(state.page==='projects')app.innerHTML=pageProjects();
  else if(state.page==='assets')app.innerHTML=pageAssets();
  else if(state.page==='tools')app.innerHTML=pageTools();
  else app.innerHTML=pageGuides();
  bindCards();
  const hq=$('#hq');
  if(hq)hq.addEventListener('input',e=>{$('#q').value=e.target.value;state.q=e.target.value;render();$('#q').value=e.target.value});
}
function bindCards(){
  document.querySelectorAll('[data-kind]').forEach(el=>el.onclick=()=>openDrawer(el.dataset.kind,el.dataset.id));
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{e.preventDefault();state.page=el.dataset.go;state.tab='全部';render();window.scrollTo(0,0)});
  document.querySelectorAll('.gtab').forEach(el=>el.onclick=()=>{
    state.tab=el.dataset.cat||el.dataset.kind;render();
  });
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.tab='全部';render();window.scrollTo(0,0)});
$('#q').addEventListener('input',e=>{state.q=e.target.value;render()});
$('#dx').onclick=()=>$('#mask').classList.remove('show');
$('#mask').onclick=e=>{if(e.target===$('#mask'))$('#mask').classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#mask').classList.remove('show')});
render();
</script>
</body>
</html>
